<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificado | IV Encuentro Empresarial de Producción Porcina Argentina</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --azul: #1F6DB1;
    --azul-oscuro: #2C4A6B;
    --azul-claro: #D1E3F6;
    --naranja: #E87722;
    --gris: #53565A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(135deg, #2C4A6B 0%, #1F6DB1 100%);
    min-height: 100vh;
    color: var(--gris);
    padding: 30px 20px;
  }
  .container { max-width: 1180px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 30px; }
  .header .logo-container {
    margin-bottom: 10px;
  }
  .header h1 {
    font-size: 20px; font-weight: 700;
    color: #ffffff; margin-bottom: 4px;
  }
  .header p { font-size: 13px; color: rgba(255,255,255,0.85); font-weight: 500; }

  .form-card {
    background: white; border-radius: 14px;
    padding: 28px 32px;
    box-shadow: 0 8px 28px rgba(31, 109, 177, 0.10);
    margin-bottom: 24px;
  }
  .form-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 16px; align-items: end;
  }
  .form-group label {
    display: block; font-size: 11px; font-weight: 700;
    color: var(--azul-oscuro); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.8px;
  }
  .form-group input, .form-group select {
    width: 100%; padding: 12px 14px;
    border: 2px solid #e0e7f0; border-radius: 7px;
    font-family: 'Montserrat', sans-serif; font-size: 15px;
    color: var(--gris); background: white;
    transition: all 0.2s ease;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none; border-color: var(--azul);
    box-shadow: 0 0 0 3px rgba(31, 109, 177, 0.10);
  }
  .form-group select { cursor: pointer; }

  .btn-row { display: flex; justify-content: center; margin-top: 22px; }
  .btn {
    padding: 14px 40px; border: none; border-radius: 7px;
    font-family: 'Montserrat', sans-serif; font-weight: 700;
    font-size: 13px; text-transform: uppercase; letter-spacing: 1.2px;
    cursor: pointer; transition: all 0.2s ease;
    background: var(--naranja); color: white;
  }
  .btn:hover:not(:disabled) {
    background: #cc6519; transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(232, 119, 34, 0.30);
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .preview-wrapper {
    background: white; border-radius: 14px;
    padding: 22px;
    box-shadow: 0 8px 28px rgba(31, 109, 177, 0.10);
  }
  .preview-label {
    text-align: center; font-size: 10.5px; font-weight: 700;
    color: var(--azul-oscuro); text-transform: uppercase;
    letter-spacing: 1.5px; margin-bottom: 14px; opacity: 0.75;
  }
  .preview-scaler {
    width: 100%; display: flex; justify-content: center; overflow: hidden;
  }

  /* NOMBRE - sobre el renglón largo (~y=345) */
  .cert-nombre {
    position: absolute;
    top: 305px; left: 0; width: 1280px;
    text-align: center;
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 36px;
    letter-spacing: 1px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  }

  /* CALIDAD - sobre el renglón corto dentro del párrafo
     Línea está aprox en x=600-770, y=430
     Centro del texto sobre la línea: x=685, y=415 (un poco arriba para "sentarse" sobre la línea) */
  .cert-calidad {
    position: absolute;
    top: 418px;
    left: 615px;
    width: 200px;
    text-align: center;
    color: #ffffff;
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    font-style: italic;
    font-size: 28px;
  }

  .info-banner {
    background: var(--azul-claro); border-left: 4px solid var(--azul);
    padding: 12px 18px; border-radius: 6px;
    font-size: 13px; color: var(--azul-oscuro);
    margin-bottom: 20px; text-align: center;
  }
  .info-banner strong { font-weight: 700; }

  .footer {
    text-align: center; margin-top: 30px;
    font-size: 11px; color: rgba(255,255,255,0.75);
    line-height: 1.6;
  }

  @media (max-width: 768px) {
    .form-row { grid-template-columns: 1fr; }
    .header .logo { font-size: 32px; }
    .header h1 { font-size: 16px; }
    .form-card { padding: 22px 18px; }
    .btn { width: 100%; }
  }
</style>

  const inputNombre = document.getElementById('nombre');
  const inputApellido = document.getElementById('apellido');

  const certCalidad = document.getElementById('certCalidad');
  const btn = document.getElementById('btnDescargar');
  const cert = document.getElementById('cert');
  const scaler = document.getElementById('scaler');

  function capitalizar(str) {
    return str.toLowerCase().split(' ').filter(s => s.length > 0)
      .map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
  }

  function actualizarPreview() {
    const nombre = capitalizar(inputNombre.value.trim());
    const apellido = capitalizar(inputApellido.value.trim());
    const calidad = selectCalidad.value === 'disertante' ? 'Disertante' : 'Participante';

    const nombreCompleto = (nombre + ' ' + apellido).trim();
    certNombre.textContent = nombreCompleto;
    certCalidad.textContent = calidad;

    btn.disabled = !(nombre.length > 0 && apellido.length > 0);
  }

  function escalarPreview() {
    const anchoDisponible = scaler.clientWidth;
    const anchoCert = 1280;
    const escala = Math.min(1, anchoDisponible / anchoCert);
    cert.style.transform = `scale(${escala})`;
    scaler.style.height = (904 * escala) + 'px';
  }

  inputApellido.addEventListener('input', actualizarPreview);
  selectCalidad.addEventListener('change', actualizarPreview);
  window.addEventListener('resize', escalarPreview);
